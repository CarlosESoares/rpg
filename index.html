<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha de RPG Digital</title>
<style>
:root{--bg:#0e0d0c;--p:#1a1816;--p2:#24211e;--red:#8c1c1c;--red2:#c23030;--gold:#c9a24b;--txt:#e9e2d0;--mut:#9a927f;--ln:#4a4338;--dem:#7a2bbf;--dem2:#b04cff}
*{box-sizing:border-box}
html{scroll-behavior:smooth;font-size:16px}
body{margin:0;background:radial-gradient(circle at 30% 0,#1d1512,var(--bg) 60%);color:var(--txt);font-family:Georgia,"Palatino Linotype",serif;line-height:1.4}
#top{position:fixed;top:0;left:0;right:0;height:48px;background:#0a0908;border-bottom:2px solid var(--gold);display:flex;align-items:center;gap:6px;padding:0 10px;z-index:20;flex-wrap:nowrap;overflow-x:auto}
#top .ti{color:var(--gold);font-weight:bold;letter-spacing:2px;margin-right:8px;white-space:nowrap}
#st{margin-left:auto;font-size:.85rem;color:var(--gold);white-space:nowrap}
#st.d{color:#e08a3c}#st.e{color:var(--red2)}
button,.b{font:inherit;font-size:.85rem;background:linear-gradient(#3a1414,var(--red));color:#f3e6c4;border:1px solid var(--gold);border-radius:3px;padding:5px 10px;cursor:pointer;white-space:nowrap}
button:hover,.b:hover{background:linear-gradient(#531a1a,var(--red2))}
#nav{position:fixed;top:48px;bottom:0;left:0;width:215px;background:#12100f;border-right:1px solid var(--gold);padding:10px 0;overflow-y:auto;z-index:15;transition:transform .2s}
#nav a{display:block;padding:8px 16px;color:var(--txt);text-decoration:none;cursor:pointer;border-left:3px solid transparent}
#nav a:hover{background:var(--p2);border-left-color:var(--red2);color:var(--gold)}
#menu{display:none}
main{margin:48px 0 0 215px;padding:20px 24px 80px;max-width:1500px}
body.nonav #nav{transform:translateX(-100%)}body.nonav main{margin-left:0}
section{background:var(--p);border:1px solid var(--gold);outline:1px solid var(--ln);outline-offset:3px;border-radius:4px;padding:16px 18px;margin:0 0 26px;scroll-margin-top:62px;position:relative}
section>h2{margin:0 0 14px;color:var(--gold);font-size:1.35rem;letter-spacing:1px;border-bottom:1px solid var(--red);padding-bottom:6px;display:flex;align-items:center;gap:10px}
section>h2 .b{margin-left:auto}
h3{color:var(--red2);margin:16px 0 8px;font-size:1.05rem;display:flex;align-items:center;gap:8px}
h3 small{color:var(--mut)}h3 .b{margin-left:auto}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.fg.big{grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
label{display:block;font-size:.78rem;color:var(--mut)}
label.w{grid-column:1/-1}
input,textarea,select{width:100%;background:#0c0b0a;color:var(--txt);border:1px solid var(--ln);border-radius:3px;padding:6px 8px;font:inherit;font-size:.95rem;margin-top:2px}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
textarea{resize:vertical;min-height:64px}
input[type=checkbox]{width:22px;height:22px;display:block}
.lst{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.ig{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.card{background:var(--p2);border:1px solid var(--ln);border-left:4px solid var(--red);border-radius:3px;padding:10px;position:relative}
.card .fg{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.card .x{float:right;margin:0 0 6px 6px;padding:2px 8px}
.ig .card{border:2px solid var(--gold);background:#1e1b17}
.ig .z1{grid-column:span 2}.ig .z2{grid-column:span 2;grid-row:span 2}
.ig .z2 textarea.ar{min-height:150px}
.s1{border-left-color:#d49a2a}.s2{border-left-color:#3f9a4a;opacity:.75}.s3{border-left-color:#555;opacity:.6}
.em{color:var(--mut);font-style:italic;margin:6px 0}
.attr,.res{background:var(--p2);border:1px solid var(--gold);border-radius:4px;padding:14px 12px;text-align:center}
.attr b,.res b{color:var(--gold);display:block;font-size:1.05rem;margin-bottom:4px}
.attr input{font-size:2.6rem;text-align:center;font-weight:bold;height:76px;padding:8px}
.res .v{display:flex;gap:6px;align-items:center}
.res .v span{font-size:1.6rem;color:var(--mut)}
.res .v input{text-align:center;font-size:2rem;font-weight:bold;margin:0;height:62px;padding:6px;min-width:0}
.res .v button{padding:0 14px;height:62px;font-size:1.5rem;flex:none}
.bar{height:10px;background:#000;border:1px solid var(--ln);margin-top:10px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5a1010,var(--red2))}
.res.dem{border-color:var(--dem2);background:linear-gradient(#241530,#1b1124)}
.res.dem b{color:var(--dem2)}
.res.dem .bar i{background:linear-gradient(90deg,#3c1066,var(--dem2))}
.res.dem .v button{background:linear-gradient(#2c1348,var(--dem));border-color:var(--dem2)}
.res.dem .v button:hover{background:linear-gradient(#3d1a63,var(--dem2))}
.coins{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:10px}
.hint{font-size:.85rem;color:var(--mut);margin:0 0 10px}
@media(max-width:800px){#nav{transform:translateX(-100%)}body.open #nav{transform:none}main{margin-left:0;padding:14px 10px 80px}#menu{display:block}.ig .z1,.ig .z2{grid-column:span 1}}
</style>
</head>
<body>
<div id="top">
<button id="menu" onclick="document.body.classList.toggle('open')">☰</button>
<span class="ti">✠ FICHA DE RPG</span>
<button id="bSave">💾 Salvar</button><button id="bLoad">↻ Recarregar dados</button><button id="bClear">🗑 Limpar ficha</button><button id="bExp">📤 Exportar ficha</button><label class="b" style="margin:0;color:#f3e6c4;font-size:.85rem">📥 Importar ficha<input type="file" id="fImp" accept=".json,application/json" hidden></label>
<span id="st">✓ Salvo</span>
</div>
<nav id="nav"></nav>
<main id="main"></main>

<script>
'use strict';
const K='ficha_rpg_digital_v1';
let S={f:{},l:{}},tm;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- Definições ---------- */
const NIV=['Nível 1','Nível 2','Nível 3','Nível 4','Nível 5','Nível 6','Nível 7','Nível 8','Nível 9','Habilidade especial','Habilidade inata','Passiva'];
const CAT=['Equipamentos','Armas','Armaduras','Itens','Itens mágicos','Consumíveis','Materiais','Quest / Missão','Itens especiais','Outros'];
const TAM=['Pequeno','Médio','Grande'];
const ST=['Pendente','Em andamento','Concluída','Falhou'];
const TC=['Texto','Número','Área de texto','Sim/Não'];
const C={
 habilidades:{b:'Adicionar habilidade',g:'nivel',f:[['nome','Nome','t'],['nivel','Nível','s',NIV],['tipo','Tipo','t'],['custo','Custo','t'],['descricao','Descrição','a'],['efeitos','Efeitos','a'],['obs','Observações','a']]},
 inv:{b:'Adicionar slot',g:'cat',all:1,cls:'ig',f:[['area','Escreva ou desenhe o item','a'],['nome','Nome do item','t'],['qtd','Qtd.','n'],['cat','Categoria','s',CAT],['tam','Tamanho do slot','s',TAM],['desc','Descrição','a']]},
 armas:{b:'Adicionar arma',f:[['nome','Nome','t'],['tipo','Tipo','t'],['dano','Dano','t'],['alcance','Alcance','t'],['efeito','Efeito','t'],['peso','Peso','t'],['custo','Custo','t'],['descricao','Descrição','a'],['obs','Observações','a']]},
 equip:{b:'Adicionar equipamento',f:[['nome','Nome','t'],['tipo','Tipo','t'],['defesa','Defesa','t'],['peso','Peso','t'],['efeitos','Efeitos','a'],['descricao','Descrição','a'],['obs','Observações','a']]},
 especiais:{b:'Adicionar habilidade especial',f:[['nome','Nome','t'],['tipo','Tipo','t'],['custo','Custo','t'],['recurso','Recurso','t'],['descricao','Descrição','a'],['efeitos','Efeitos','a'],['obs','Observações','a']]},
 missoes:{b:'Nova missão',f:[['nome','Nome','t'],['status','Status','s',ST],['descricao','Descrição','a'],['objetivo','Objetivo','a'],['recompensa','Recompensa','a']]},
 npcs:{b:'Adicionar NPC',f:[['nome','Nome','t'],['raca','Raça','t'],['funcao','Função','t'],['relacao','Relação com personagem','t'],['descricao','Descrição','a'],['info','Informações','a'],['obs','Observações','a']]},
 locais:{b:'Adicionar local',f:[['nome','Nome','t'],['regiao','Região','t'],['descricao','Descrição','a'],['info','Informações','a'],['segredos','Segredos','a'],['obs','Observações','a']]},
 diario:{b:'Nova entrada',f:[['titulo','Título','t'],['data','Data','d'],['texto','Texto','a']]},
 notas:{b:'Nova anotação',f:[['titulo','Título','t'],['data','Data (opcional)','d'],['texto','Texto','a']]},
 custom:{b:'Adicionar campo personalizado',f:[['nome','Nome do campo','t'],['tipo','Tipo do campo','s',TC],['valor','Valor','v']]},
 moedas:{b:'Adicionar moeda',f:[['nome','Outra moeda','t'],['valor','Quantidade','t']]}
};

/* ---------- Construção da interface ---------- */
const fld=(k,lb,a)=>`<label>${lb}${a?`<textarea data-k="${k}" rows="4"></textarea>`:`<input data-k="${k}">`}</label>`;
const lst=(L)=>`<div id="c-${L}"></div>`;
const RES=[['vida','♥ Vida'],['san','☽ Sanidade'],['mana','✧ Mana'],['vig','⚡ Vigor'],['con','◎ Pontos de concentração'],['esp','☸ Pontos espirituais'],['esq','➶ Pontos de esquiva'],['dem',' Poder demoníaco']];
const SEC=[
 ['personagem','🧑','Personagem',`<div class="fg">${[['nome','Nome'],['idade','Idade'],['raca','Raça'],['classe','Classe'],['altura','Altura'],['nivel','Nível'],['xp','Experiência']].map(a=>fld(...a)).join('')}</div><div class="fg" style="margin-top:10px">${[['aparencia','Aparência'],['personalidade','Personalidade'],['historia','História'],['objetivos','Objetivos']].map(a=>fld(a[0],a[1],1)).join('')}</div>`],
 ['atributos','⚔','Atributos',`<div class="fg big">${['Força','Destreza','Constituição','Carisma','Sabedoria','Inteligência','Fratura','Deslocamento'].map(n=>`<div class="attr"><b>${n}</b><input data-k="a_${n}"></div>`).join('')}</div><div class="fg" style="margin-top:10px">${fld('marca','Marca da morte',1)}</div>`],
 ['recursos','♥','Recursos',`<div class="fg big">${RES.map(([k,n])=>`<div class="res${k==='dem'?' dem':''}"><b>${n}</b><div class="v"><button data-adj="r_${k}_a" data-d="-1">−</button><input data-k="r_${k}_a" inputmode="numeric"><span>/</span><input data-k="r_${k}_m" inputmode="numeric"><button data-adj="r_${k}_a" data-d="1">+</button></div><div class="bar"><i data-bar="${k}"></i></div></div>`).join('')}<div class="res"><b>🛡 CA</b><div class="v"><input data-k="r_ca"></div></div></div><div class="fg" style="margin-top:14px">${fld('dem_notas','Poder demoníaco — anotações (origem, habilidades, efeitos, custos)',1)}</div>`],
 ['habilidades','✦','Habilidades',`<p class="hint">As habilidades ficam agrupadas pelo campo Nível. Mude o nível no seletor para movê-la de grupo.</p>${lst('habilidades')}`,'habilidades'],
 ['inventario','🎒','Inventário',`<h3>Moedas</h3><div class="coins">${['Ouro','Prata','Cobre'].map(n=>fld('m_'+n,n)).join('')}</div>${lst('moedas')}<div style="margin:10px 0"><button data-add="moedas">➕ Adicionar moeda</button></div><div class="fg" style="margin:10px 0">${fld('capacidade','Capacidade do inventário')}</div>${lst('inv')}`],
 ['armas','⚔','Armas',lst('armas'),'armas'],
 ['equipamentos','🛡','Equipamentos',lst('equip'),'equip'],
 ['especiais','☠','Habilidades especiais',`<p class="hint">Sistemas únicos do personagem (ex.: Sistema Nemesis, habilidades inatas de regras próprias).</p>${lst('especiais')}`,'especiais'],
 ['missoes','📜','Missões',lst('missoes'),'missoes'],
 ['npcs','👤','NPCs',lst('npcs'),'npcs'],
 ['locais','🗺','Locais',lst('locais'),'locais'],
 ['diario','📖','Diário',lst('diario'),'diario'],
 ['notas','📝','Anotações',lst('notas'),'notas'],
 ['custom','🧩','Campos personalizados',`<p class="hint">Crie campos para regras próprias que não existem na ficha.</p>${lst('custom')}`,'custom'],
 ['config','⚙','Configurações',`<div class="fg"><label>Tamanho da fonte<select data-k="cfg_fs"><option value="14px">Pequena</option><option value="16px">Normal</option><option value="18px">Grande</option><option value="20px">Muito grande</option></select></label></div><p class="hint" style="margin-top:12px">Os dados ficam salvos no localStorage deste navegador, sem servidor ou internet. Limpar os dados do navegador apaga a ficha: use 📤 Exportar ficha para manter backups em .json.</p>`]
];
function build(){
 $('nav').innerHTML=SEC.map(s=>`<a data-nav="${s[0]}">${s[1]} ${s[2]}</a>`).join('');
 $('main').innerHTML=SEC.map(s=>`<section id="${s[0]}"><h2>${s[1]} ${s[2]}${s[4]?`<button class="b" data-add="${s[4]}">➕ ${C[s[4]].b}</button>`:''}</h2>${s[3]}</section>`).join('');
}

/* ---------- Blocos dinâmicos ---------- */
function campo(x,f){
 const [k,lb,t,o]=f,v=x[k];let i;
 if(t==='a')i=`<textarea data-f="${k}" rows="3"${k==='area'?' class="ar"':''}>${esc(v)}</textarea>`;
 else if(t==='s')i=`<select data-f="${k}">${o.map(p=>`<option${p===(v||o[0])?' selected':''}>${p}</option>`).join('')}</select>`;
 else if(t==='v'){
  if(x.tipo==='Sim/Não')i=`<input type="checkbox" data-f="${k}"${v===true?' checked':''}>`;
  else if(x.tipo==='Área de texto')i=`<textarea data-f="${k}" rows="3">${esc(v)}</textarea>`;
  else i=`<input data-f="${k}" type="${x.tipo==='Número'?'number':'text'}" value="${esc(v)}">`;
 }else i=`<input data-f="${k}" type="${t==='n'?'number':t==='d'?'date':'text'}" value="${esc(v)}">`;
 return `<label class="${t==='a'?'w':''}">${lb}${i}</label>`;
}
function card(L,x,i){
 let z='';
 if(L==='inv')z='z'+Math.max(0,TAM.indexOf(x.tam));
 if(L==='missoes')z='s'+Math.max(0,ST.indexOf(x.status));
 return `<div class="card ${z}" data-l="${L}" data-i="${i}"><button class="x" data-rm>🗑 Remover</button><div class="fg">${C[L].f.map(f=>campo(x,f)).join('')}</div></div>`;
}
function renderLista(L){
 const c=C[L],ls=S.l[L]||[],el=$('c-'+L);let h='';
 if(c.g){
  const opts=c.f.find(f=>f[0]===c.g)[3];
  opts.forEach(o=>{
   const it=ls.map((x,i)=>[x,i]).filter(p=>(p[0][c.g]||opts[0])===o);
   if(it.length||c.all)h+=`<h3>${o} <small>(${it.length})</small>${c.all?`<button class="b" data-add="${L}" data-g="${o}">➕ Adicionar slot</button>`:''}</h3><div class="${c.cls||'lst'}">${it.map(p=>card(L,p[0],p[1])).join('')}</div>`;
  });
 }else h=`<div class="${c.cls||'lst'}">${ls.map((x,i)=>card(L,x,i)).join('')}</div>`;
 if(!ls.length&&!c.all)h+='<p class="em">Nada aqui ainda. Use o botão ➕ para adicionar.</p>';
 el.innerHTML=h;
}
function adicionar(L,g){
 const c=C[L],o={};
 c.f.forEach(f=>{if(f[2]==='s')o[f[0]]=f[3][0]});
 if(g)o[c.g]=g;
 (S.l[L]=S.l[L]||[]).push(o);
 renderLista(L);salvarDados();
}
function remover(L,i){
 if(!confirm('Tem certeza que deseja remover este item?'))return;
 S.l[L].splice(i,1);renderLista(L);salvarDados();
}

/* ---------- Campos fixos ---------- */
function preencher(){
 document.querySelectorAll('[data-k]').forEach(e=>{e.value=S.f[e.dataset.k]||(e.tagName==='SELECT'?'16px':'')});
 barras();
 document.documentElement.style.fontSize=S.f.cfg_fs||'16px';
}
function barras(){
 RES.forEach(([k])=>{
  const a=parseFloat(S.f['r_'+k+'_a']),m=parseFloat(S.f['r_'+k+'_m']);
  const p=m>0&&a>=0?Math.min(100,a/m*100):0;
  document.querySelector(`[data-bar="${k}"]`).style.width=p+'%';
 });
}
function renderTudo(){preencher();Object.keys(C).forEach(renderLista)}

/* ---------- Salvamento ---------- */
function status(t,c){const s=$('st');s.textContent=t;s.className=c||''}
function marcarAlterado(){status('● Alterações não salvas','d');clearTimeout(tm);tm=setTimeout(salvarDados,500)}
function salvarDados(){
 clearTimeout(tm);status('● Salvando...','d');
 try{localStorage.setItem(K,JSON.stringify(S));setTimeout(()=>status('✓ Salvo'),200)}
 catch(e){status('● Erro ao salvar (exporte um backup)','e')}
}
function carregarDados(){
 try{const d=JSON.parse(localStorage.getItem(K));if(d&&d.f&&d.l)S=d;else S={f:{},l:{}}}
 catch(e){S={f:{},l:{}}}
}
function recarregar(){carregarDados();renderTudo();status('✓ Salvo')}
function limparFicha(){
 if(!confirm('Tem certeza que deseja apagar todos os dados? Essa ação não poderá ser desfeita.'))return;
 S={f:{},l:{}};renderTudo();salvarDados();
}
function exportarDados(){
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));
 a.download='personagem.json';document.body.appendChild(a);a.click();a.remove();
}
function importarDados(file){
 if(!file)return;
 const r=new FileReader();
 r.onload=()=>{
  try{
   const d=JSON.parse(r.result);
   if(!d||typeof d.f!=='object'||typeof d.l!=='object')throw 0;
   if(!confirm('Importar este arquivo substituirá a ficha atual. Continuar?'))return;
   S={f:d.f,l:d.l};renderTudo();salvarDados();
  }catch(e){alert('Arquivo inválido. Selecione um .json exportado por esta ficha.')}
  $('fImp').value='';
 };
 r.readAsText(file);
}

/* ---------- Eventos ---------- */
function gravar(t,v){
 const c=t.closest('[data-i]'),x=S.l[c.dataset.l][c.dataset.i];
 x[t.dataset.f]=v;
 if(c.dataset.l==='custom'&&t.dataset.f==='tipo')x.valor='';
 return c.dataset.l;
}
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset.k){S.f[t.dataset.k]=t.value;if(t.dataset.k==='cfg_fs')document.documentElement.style.fontSize=t.value;barras();marcarAlterado()}
 else if(t.dataset.f&&t.tagName!=='SELECT'&&t.type!=='checkbox'){gravar(t,t.value);marcarAlterado()}
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.f&&t.type==='checkbox'){gravar(t,t.checked);marcarAlterado()}
 else if(t.dataset.f&&t.tagName==='SELECT'){const L=gravar(t,t.value);renderLista(L);marcarAlterado()}
});
document.addEventListener('click',e=>{
 const t=e.target.closest('button,a,[data-nav]');if(!t)return;
 if(t.dataset.add)adicionar(t.dataset.add,t.dataset.g);
 else if(t.hasAttribute('data-rm')){const c=t.closest('[data-i]');remover(c.dataset.l,+c.dataset.i)}
 else if(t.dataset.adj){
  const k=t.dataset.adj,n=(parseInt(S.f[k])||0)+(+t.dataset.d);
  S.f[k]=String(n);document.querySelector(`[data-k="${k}"]`).value=n;barras();marcarAlterado();
 }else if(t.dataset.nav){
  $(t.dataset.nav).scrollIntoView({behavior:'smooth'});document.body.classList.remove('open');
 }
});
$('bSave').onclick=salvarDados;$('bLoad').onclick=recarregar;$('bClear').onclick=limparFicha;$('bExp').onclick=exportarDados;
$('fImp').onchange=e=>importarDados(e.target.files[0]);
window.addEventListener('beforeunload',()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}});

/* ---------- Início ---------- */
build();carregarDados();renderTudo();
</script>
</body>
</html>
